<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hillpoint Agency Ltd | Nairobi Homes &amp; 2-Min WhatsApp Viewing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-black: #050505;
      --bg-card: #111111;
      --bg-elevated: #191919;
      --goldish: #FFB000;
      --goldish-bright: #FFC933;
      --goldish-dim: rgba(255, 176, 0, 0.28);
      --text-main: #FFFDF7;
      --text-muted: #C8BEA8;
      --live-green: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .live-dot {
      position: relative;
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background-color: var(--live-green);
      flex-shrink: 0;
    }

    .live-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 999px;
      border: 2px solid var(--live-green);
      animation: pulseRing 1.7s infinite;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.75); opacity: 0.9; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    .top-strip {
      background-color: #0B0B0B;
      border-bottom: 1px solid var(--goldish-dim);
      font-size: 12px;
      padding: 10px 0;
    }

    .top-strip-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--goldish);
      font-weight: 700;
    }

    .status-pill {
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--goldish-dim);
      background-color: var(--bg-card);
      color: var(--goldish-bright);
      font-size: 11px;
      font-weight: 600;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(5, 5, 5, 0.95);
      border-bottom: 1px solid var(--goldish-dim);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-badge {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--goldish);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--goldish);
      font-size: 24px;
      font-weight: 700;
    }

    .brand-badge .live-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      border: 2px solid var(--bg-black);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--goldish-bright);
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .nav-links {
      display: none;
      gap: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--goldish); }

    @media (min-width: 768px) {
      .nav-links { display: flex; }
    }

    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--goldish);
      color: #050505;
      border: 1px solid var(--goldish-bright);
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
